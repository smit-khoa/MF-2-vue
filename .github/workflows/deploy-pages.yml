# Build all 3 MFE apps and deploy to GitHub Pages under /MF-2-vue/.
# Shell (host) + adaccounts + ads-manager share one origin → no CORS, no mixed-content.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deploy; queue new pushes without cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /MF-2-vue/
      ADACCOUNTS_REMOTE_URL: https://smit-khoa.github.io/MF-2-vue/adaccounts
      ADS_MANAGER_REMOTE_URL: https://smit-khoa.github.io/MF-2-vue/ads-manager
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript natively — required to load the .ts rspack configs.
          # (Node 20 throws ERR_UNKNOWN_FILE_EXTENSION on rspack.config.ts.)
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BASE_PATH + remote URLs are read at build time (rspack DefinePlugin / dev-proxy-config).
      - run: pnpm build

      # Merge the 3 dist/ outputs into one Pages tree. Remotes nest under their URL segment.
      - name: Assemble _site
        run: |
          mkdir -p _site/adaccounts _site/ads-manager
          cp -r apps/shell/dist/* _site/
          cp -r apps/adaccounts/dist/* _site/adaccounts/
          cp -r apps/ads-manager/dist/* _site/ads-manager/
          # SPA deep-link fallback: Pages serves 404.html for unknown paths.
          cp _site/index.html _site/404.html
          # Skip Jekyll so files/dirs starting with _ are published as-is.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
